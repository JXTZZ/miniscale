[project]
name = "miniscale"
version = "0.1.0"
description = "A from-scratch, testable pretrain-to-agent-RL learning stack"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.3,<3",
    "sentencepiece>=0.2.1,<0.3",
    "torch==2.9.1",
    "transformers==4.57.6",
]

[project.scripts]
miniscale = "miniscale:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
